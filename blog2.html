<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Huelin | Blog</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Yomogi&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="home.css">
</head>
<body>
  <main class="page">
    <a class="back scribble rise" href="profile.html" style="--i:0">&larr; home</a>

    <h1 class="banner rise" style="--i:1">
      <img src="header-image.png" alt="Huelin's Blog" width="1600" height="400">
    </h1>

    <section class="posts rise" style="--i:2" aria-label="Posts">
      <details class="post" data-file="blog/2025-07-28.html">
        <summary><time datetime="2025-07-28">2025-07-28</time><span class="post-title scribble">The Ocean AItuber</span><span class="post-mark" aria-hidden="true">+</span></summary>
        <div class="post-body"></div>
      </details>
      <details class="post" data-file="blog/2025-07-20.html">
        <summary><time datetime="2025-07-20">2025-07-20</time><span class="post-title scribble alt">First print of my doujinshi</span><span class="post-mark" aria-hidden="true">+</span></summary>
        <div class="post-body"></div>
      </details>
      <details class="post" data-file="blog/2025-06-25.html">
        <summary><time datetime="2025-06-25">2025-06-25</time><span class="post-title scribble">AItuber Kachess Design</span><span class="post-mark" aria-hidden="true">+</span></summary>
        <div class="post-body"></div>
      </details>
      <details class="post" data-file="blog/2025-06-21.html">
        <summary><time datetime="2025-06-21">2025-06-21</time><span class="post-title scribble alt">Shogi in Unity</span><span class="post-mark" aria-hidden="true">+</span></summary>
        <div class="post-body"></div>
      </details>
    </section>
  </main>

  <footer>&copy; 2025 irorinri</footer>

  <script>
    // 開いた記事だけ読み込む。開けるのは一度にひとつ
    const posts = document.querySelectorAll('.post');
    posts.forEach((post) => {
      post.addEventListener('toggle', async () => {
        if (!post.open) return;
        posts.forEach((other) => { if (other !== post) other.open = false; });

        const body = post.querySelector('.post-body');
        if (body.dataset.loaded) return;
        body.textContent = 'loading…';
        try {
          const res = await fetch(post.dataset.file);
          if (!res.ok) throw new Error(res.status);
          body.innerHTML = await res.text();
          body.dataset.loaded = '1';
        } catch {
          body.textContent = '記事の読み込みに失敗しました。';
        }
      });
    });
  </script>
  <script src="paper.js"></script>
</body>
</html>
